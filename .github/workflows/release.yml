name: Release

on:
  workflow_run:
    workflows: ["Tests & Coverage"]
    types:
      - completed
    branches:
      - main
      - feature/*
      - hotfix/*
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout (full history required by GitVersion)
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.4.x'

      - name: Compute version with GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Determine release tag
        id: determine_tag
        run: |
          set -euo pipefail
          BRANCH_NAME="${GITHUB_REF_NAME}"
          IS_PRERELEASE="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG}" == *-beta* ]]; then
              IS_PRERELEASE="true"
            fi
            echo "Triggered by tag push; using tag $TAG"
          else
            if [[ "${BRANCH_NAME}" == "main" ]]; then
              TAG="v${{ steps.gitversion.outputs.MajorMinorPatch }}"
              echo "On main; using clean tag $TAG"
            else
              TAG="v${{ steps.gitversion.outputs.SemVer }}"
              if [[ "${TAG}" != *-beta* ]]; then
                PRE_NUM="${{ steps.gitversion.outputs.PreReleaseNumber }}"
                PRE_NUM="${PRE_NUM:-0}"
                TAG="v${{ steps.gitversion.outputs.MajorMinorPatch }}-beta.${PRE_NUM}"
              fi
              IS_PRERELEASE="true"
              echo "On ${BRANCH_NAME}; using prerelease SemVer tag $TAG"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag and push
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}   # only run when NOT a tag push
        run: |
          set -euo pipefail
          TAG="${{ steps.determine_tag.outputs.TAG }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping creation"
            exit 0
          fi

          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: Update manifest version
        run: |
          set -euo pipefail
          VERSION="${{ steps.determine_tag.outputs.TAG }}"
          # Remove leading 'v' if present
          VERSION="${VERSION#v}"
          echo "Updating manifest.json version to $VERSION"
          python3 << EOF
          import json
          with open('custom_components/volkswagen_goconnect/manifest.json', 'r') as f:
            manifest = json.load(f)
          manifest['version'] = '$VERSION'
          with open('custom_components/volkswagen_goconnect/manifest.json', 'w') as f:
            json.dump(manifest, f, indent=2)
            f.write('\n')
          EOF

      - name: Commit manifest version update
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}   # only run when NOT a tag push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          fi

          git add custom_components/volkswagen_goconnect/manifest.json
          git commit -m "chore: update manifest version to ${{ steps.determine_tag.outputs.TAG }}" || echo "No changes to commit"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Build integration zip
        uses: vimtor/action-zip@v1
        with:
          files: custom_components/volkswagen_goconnect
          dest: volkswagen_goconnect.zip

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.determine_tag.outputs.TAG }}
          name: ${{ steps.determine_tag.outputs.TAG }}
          draft: false
          prerelease: ${{ steps.determine_tag.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: volkswagen_goconnect.zip