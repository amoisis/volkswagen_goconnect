mode: ContinuousDelivery
tag-prefix: '[vV]'
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
  feature:
    regex: ^features?[/-]
    increment: Minor
    label: beta
  hotfix:
    regex: ^hotfix(es)?[/-]
    increment: Patch
    label: beta
  unknown:
    regex: ^(?!main$).*
    increment: Patch
    label: beta